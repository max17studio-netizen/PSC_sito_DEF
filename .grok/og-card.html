<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cinzel";
      font-weight: 500;
      src: url("og-fonts/cinzel-500.ttf") format("truetype");
    }
    @font-face {
      font-family: "Cinzel";
      font-weight: 700;
      src: url("og-fonts/cinzel-700.ttf") format("truetype");
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-weight: 600;
      src: url("og-fonts/cormorant-600.ttf") format("truetype");
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-weight: 700;
      src: url("og-fonts/cormorant-700.ttf") format("truetype");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F3EEE6;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background: #F3EEE6;
      color: #1A1714;
    }
    .pier {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 92px;
      background: #8C3A28;
      background-image:
        repeating-linear-gradient(
          to bottom,
          #8C3A28 0 22px,
          #C9A08A 22px 23px
        );
    }
    .pier-left { left: 0; }
    .pier-right { right: 0; }
    .pier::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          to right,
          transparent 0 44px,
          rgba(26, 23, 20, 0.18) 44px 45px
        );
      mix-blend-mode: multiply;
    }
    .plinth {
      position: absolute;
      left: 92px;
      right: 92px;
      bottom: 0;
      height: 48px;
      background: #E8E0D4;
      border-top: 3px solid #1A1714;
    }
    .lintel {
      position: absolute;
      left: 92px;
      right: 92px;
      top: 0;
      height: 36px;
      background: #E8E0D4;
      border-bottom: 3px solid #1A1714;
    }
    .inner {
      position: absolute;
      left: 92px;
      right: 92px;
      top: 36px;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin-bottom: 28px;
    }
    .kicker {
      font-family: "Cinzel", serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.52em;
      color: #8C3A28;
      padding-left: 0.52em;
      margin-bottom: 18px;
    }
    .title {
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      font-size: 72px;
      line-height: 0.92;
      letter-spacing: 0.06em;
      text-align: center;
      color: #1A1714;
    }
    .title span {
      display: block;
    }
    .rule {
      width: 220px;
      height: 2px;
      background: #8C3A28;
      margin: 26px 0 18px;
    }
    .tag {
      font-family: "Cinzel", serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.58em;
      color: #8C3A28;
      padding-left: 0.58em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pier pier-left"></div>
    <div class="pier pier-right"></div>
    <div class="lintel"></div>
    <div class="plinth"></div>
    <div class="inner">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="5" y="8" width="22" height="3" fill="#1A1714"/>
        <rect x="7" y="11" width="18" height="15" fill="#8C3A28"/>
        <rect x="10" y="14" width="4" height="4" fill="#E8E0D4"/>
        <rect x="18" y="14" width="4" height="4" fill="#E8E0D4"/>
        <rect x="10" y="20" width="4" height="4" fill="#E8E0D4"/>
        <rect x="18" y="20" width="4" height="4" fill="#E8E0D4"/>
      </svg>
      <div class="kicker">P.S.C.</div>
      <div class="title">
        <span>EDILIZIA</span>
        <span>MODERNA</span>
      </div>
      <div class="rule"></div>
      <div class="tag">COSTRUZIONI</div>
    </div>
  </div>
</body>
</html>
